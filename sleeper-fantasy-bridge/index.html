<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doughnut War Room</title><style>:root{--p:#d94f91;--pink:#fff0f6;--b:#ead4df;--m:#7e6f78;--t:#171923}*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:var(--t);font-family:Inter,system-ui}.app{max-width:1450px;margin:auto;padding:24px}.top,.panel,.card{background:#fff;border:1px solid var(--b);border-radius:18px;box-shadow:0 8px 28px #532e4110}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}.brand{display:flex;gap:14px;align-items:center}.brand img{width:76px;height:76px;object-fit:contain}.k,.ey{font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--p)}h1{margin:3px 0;font-size:46px;line-height:1}.muted{color:var(--m);font-size:12px}.nav{display:flex;gap:8px;margin:18px 0}.nav button,.action{border:1px solid var(--b);background:#fff;border-radius:10px;padding:10px 14px;font-weight:850;color:var(--m);cursor:pointer}.nav button.active,.action.primary{background:var(--pink);border-color:#ee91bd;color:#79274f}.strip{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:12px;margin-bottom:18px}.card{padding:17px}.big{font-size:26px;font-weight:950;margin-top:7px}.layout{display:grid;grid-template-columns:1fr 350px;gap:18px}.ph{padding:14px 16px;background:var(--pink);border-bottom:1px solid var(--b);font-weight:950;text-transform:uppercase}.content{padding:16px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.player{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}.name{font-weight:850}.badge{background:var(--pink);border-radius:6px;padding:3px 7px;font-size:10px;font-weight:900}.inj{font-size:10px;color:#b54150;font-weight:800}.coach{white-space:pre-wrap;border-left:4px solid var(--p);background:var(--pink);padding:13px;border-radius:0 9px 9px 0;font-size:13px;line-height:1.5}.actions{display:grid;gap:8px;margin-top:12px}.pin{width:100%;padding:11px;margin-top:12px;border:1px solid var(--b);border-radius:9px}.pick{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:10px;border-bottom:1px solid var(--b)}.me{background:var(--pink)}@media(max-width:900px){.layout{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:550px){.app{padding:12px}.strip{grid-template-columns:1fr}h1{font-size:34px}.brand img{width:56px}}</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/doughnuts-helmet.png"><div><div class="k">Basingstoke Doughnuts Football Operations</div><h1>The War Room</h1><div class="muted" id="sub">Connecting…</div></div></div><div class="muted" id="sync">—</div></header><nav class="nav"><button data-mode="draft">Draft</button><button data-mode="waivers">Waivers</button><button class="active" data-mode="lineup">Lineup</button></nav><section class="strip"><article class="card"><div class="ey">Current mission</div><div class="big" id="mission">Thursday team sheet</div><div class="muted" id="detail">Loading Doughnuts…</div></article><article class="card"><div class="ey" id="l1">Week</div><div class="big" id="v1">—</div></article><article class="card"><div class="ey" id="l2">Record</div><div class="big" id="v2">—</div></article><article class="card"><div class="ey" id="l3">Opponent</div><div class="big" id="v3">—</div></article></section><section class="layout"><article class="panel"><div class="ph" id="title">Current Lineup</div><div class="content" id="main"></div></article><aside class="panel"><div class="ph">Doughnut Captain</div><div class="content"><div class="coach" id="coach">Live Sleeper state connected. Call the Captain.</div><div class="actions" id="actions"></div><input class="pin" id="pin" type="password" placeholder="War Room PIN"><div class="muted" id="help" style="margin-top:8px">Advice only. You make every move.</div></div></aside></section></main><script>
let state,mode='lineup';const $=x=>document.getElementById(x),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function player(p){return`<div class="player"><div><div class="name">${esc(p?.full_name||'Unknown')}</div><div class="muted">${esc(p?.team||'')} <span class="badge">${esc(p?.position||'?')}</span></div></div><div class="inj">${esc(p?.injury_status||p?.status||'')}</div></div>`}function buttons(a){$('actions').innerHTML=a.map((x,i)=>`<button class="action ${i===0?'primary':''}" data-c="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>ask(b.dataset.c,b))}function lineup(){let w=state.current_week||{},t=state.my_team||{};$('mission').textContent='Set the Doughnuts';$('detail').textContent=`Week ${w.week??'—'} • starters, bench, opponent and fresh intelligence`;$('l1').textContent='Week';$('v1').textContent=w.week??'—';$('l2').textContent='Record';$('v2').textContent=t.record?`${t.record.wins}-${t.record.losses}`:'—';$('l3').textContent='Opponent';$('v3').textContent=w.opponent?.owner||'—';$('title').textContent='Current Lineup';$('main').innerHTML=`<div class="cols"><div><div class="ey">Starters</div>${(t.starters||[]).map(player).join('')}</div><div><div class="ey">Bench</div>${(t.bench||[]).map(player).join('')}</div></div>`;buttons([['lineup','Review lineup — START / BENCH / WATCH']])}function waivers(){let w=state.waivers||{},a=w.available_trending_adds||[];$('mission').textContent='Hunt for sprinkles';$('detail').textContent='Sleeper-trending players filtered against every Aardvark roster';$('l1').textContent='Waiver priority';$('v1').textContent=w.position??'—';$('l2').textContent='Budget used';$('v2').textContent=w.budget_used??'—';$('l3').textContent='Available trends';$('v3').textContent=a.length;$('title').textContent='Waiver Room';$('main').innerHTML=a.length?a.map(x=>`<div class="player"><div><div class="name">${esc(x.player?.full_name||'Unknown')}</div><div class="muted">${esc(x.player?.team||'')} <span class="badge">${esc(x.player?.position||'?')}</span></div></div><div class="muted">+${esc(x.count)}</div></div>`).join(''):'<div class="muted">No available trending adds right now.</div>';buttons([['waivers','Find moves — ADD / DROP / PRIORITY']])}function draft(){let d=state.draft;$('mission').textContent='Draft archive';$('detail').textContent=d?`${d.picks_made}/${d.expected_total_picks} picks • ${d.status}`:'No draft state';$('l1').textContent='Status';$('v1').textContent=d?.status||'—';$('l2').textContent='Our slot';$('v2').textContent=d?.my_draft_slot||'—';$('l3').textContent='Picks';$('v3').textContent=d?`${d.picks_made}/${d.expected_total_picks}`:'—';$('title').textContent='Draft Board Archive';$('main').innerHTML=(d?.picks||[]).map(x=>`<div class="pick ${Number(x.roster_id)===Number(state.my_team?.roster_id)?'me':''}"><b>#${x.pick_no}</b><span>${esc(x.player?.full_name)}</span><span class="badge">${esc(x.player?.position)}</span></div>`).join('');buttons([['what_happened','Draft debrief'],['best_value','Best value by position']])}function render(){$('sub').textContent=`${state.league?.name||'Fantasy League'} • ${state.my_team?.team_name||'My Team'}`;$('sync').textContent=`Sync ${new Date(state.generated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));mode==='lineup'?lineup():mode==='waivers'?waivers():draft()}async function refresh(){const r=await fetch(`/api/draft-room?t=${Date.now()}`,{cache:'no-store'});state=await r.json();if(!r.ok)throw Error(state.detail||state.error);render()}async function ask(m,b){let pin=$('pin').value.trim();if(!pin){$('help').textContent='War Room PIN required.';return}let old=b.textContent;b.disabled=true;b.textContent='Captain working…';$('coach').textContent='Checking Sleeper and current intelligence… 🍩';try{let r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m,pin})}),d=await r.json();if(!r.ok)throw Error(d.detail||d.error);$('coach').textContent=d.response;$('help').textContent='Fresh Sleeper state + current web research. You make the call.'}catch(e){$('coach').textContent=`Headset malfunction: ${e.message}`}finally{b.disabled=false;b.textContent=old}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});refresh();setInterval(refresh,15000);
</script></body></html>
